<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Caspian</title>
  <link rel="stylesheet" href="/assets/app.css?v=config-edit-1">
  <link rel="stylesheet" href="/assets/skills.css?v=change50">
  <link rel="stylesheet" href="/assets/markdown.css?v=merge-45">
  <link rel="stylesheet" href="/assets/context.css?v=f49">
  <link rel="stylesheet" href="/assets/plugins.css?v=plugin-1">
  <link rel="stylesheet" href="/assets/ui-polish.css?v=polish-10">
</head>
<body>
  <p id="ui-status-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <section id="login-view" class="login-view">
    <main class="login-panel">
      <div class="brand brand-login">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span>Caspian</span>
      </div>
      <h1>继续工作</h1>
      <form id="login-form">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="button button-primary button-wide" type="submit">登录</button>
      </form>
    </main>
  </section>

  <div id="app-view" class="app-shell" hidden>
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span>Caspian</span>
        </div>
        <button id="new-thread" class="icon-button" type="button" title="新建会话" aria-label="新建会话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>
      <nav id="thread-list" class="thread-list" aria-label="会话列表"></nav>
      <footer class="user-row">
        <button id="user-menu-button" class="user-row-main" type="button"
          title="打开设置" aria-label="打开设置" aria-haspopup="menu" aria-expanded="false">
          <span id="user-avatar" class="avatar"></span>
          <span id="user-name" class="user-name"></span>
        </button>
        <div id="settings-menu" class="settings-menu" role="menu" hidden>
          <button id="open-settings" class="settings-menu-item" type="button" role="menuitem">设置</button>
        </div>
        <button id="logout" class="icon-button icon-button-muted" type="button" title="退出登录" aria-label="退出登录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/></svg>
        </button>
      </footer>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <button id="mobile-thread-toggle" class="icon-button mobile-header-button" type="button"
          title="打开会话列表" aria-label="打开会话列表" aria-controls="thread-list" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="workspace-heading">
          <h1 id="thread-title">新会话</h1>
          <p id="thread-id" class="thread-id"></p>
        </div>
        <button id="mobile-context-toggle" class="icon-button mobile-header-button" type="button"
          title="打开 Context 列表" aria-label="打开 Context 列表" aria-controls="context-rail"
          aria-expanded="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 8h7a3 3 0 013 3v9M7 16h7"/></svg>
        </button>
        <button id="decision-table-toggle" class="icon-button" type="button" title="查看等级表" aria-label="查看等级表"
          aria-controls="decision-table-panel" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 9h18M3 13h18M3 17h18"/></svg>
        </button>
        <button id="plugin-toggle" class="icon-button" type="button" title="插件调试视图" aria-label="插件调试视图"
          aria-controls="plugin-panel" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V7z"/></svg>
        </button>
        <span id="run-status" class="status status-ready"><span></span>就绪</span>
      </header>

      <section id="commitment-progress" class="commitment-progress" hidden aria-label="承诺流程进度">
        <div class="progress-heading">
          <strong>任务合同</strong>
          <span id="progress-label">正在澄清目标</span>
        </div>
        <ol id="progress-steps"></ol>
      </section>

      <section id="messages" class="messages" role="log" aria-label="对话消息" aria-live="off">
        <div id="empty-state" class="empty-state">
          <span class="empty-mark" aria-hidden="true">C</span>
          <h2>把目标交给 Caspian</h2>
          <div class="prompt-row">
            <button type="button" data-prompt="分析这个项目并完成当前需求">分析项目需求</button>
            <button type="button" data-prompt="根据我提供的资料制定并执行任务">基于资料执行</button>
          </div>
        </div>
      </section>

      <section class="composer-wrap">
        <div class="composer-surface">
          <div id="goal-bar" class="goal-bar" hidden></div>
          <div id="attachments" class="attachments" hidden></div>
          <div id="skill-picker" class="skill-picker" hidden></div>
          <form id="composer" class="composer">
            <div class="composer-row-main">
              <div id="selected-skills" class="selected-skills" aria-label="Selected Skills" hidden></div>
            <textarea id="message-input" rows="1" placeholder="输入任务…" aria-label="任务内容"
              role="combobox" aria-autocomplete="list" aria-haspopup="listbox"
              aria-expanded="false"></textarea>
            <button id="interrupt-button" class="icon-button composer-icon interrupt-icon" type="button" title="打断" aria-label="打断" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z"/></svg>
            </button>
            <button id="send-button" class="send-button" type="submit" aria-label="发送" title="发送">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
          <div class="composer-row-settings">
            <input id="file-input" type="file" multiple hidden>
            <button id="attach-button" class="icon-button composer-icon" type="button" title="添加文件" aria-label="添加文件">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.6l-8.9 8.9a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 015.7 5.7l-9.2 9.2a2 2 0 01-2.8-2.8l8.6-8.6"/></svg>
            </button>
            <div class="composer-settings-right">
              <button id="model-toggle" type="button" class="model-toggle" aria-haspopup="listbox" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V7z"/></svg>
                <span class="model-label">模型</span>
                <span id="model-name" class="model-name"></span>
                <svg class="model-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div id="model-popover" class="model-popover" role="listbox" aria-label="选择模型" hidden></div>
            </div>
          </div>
        </form>
        </div>
      </section>
    </main>
    <button id="mobile-drawer-backdrop" class="mobile-drawer-backdrop" type="button"
      aria-label="关闭导航" hidden></button>
  </div>

  <template id="review-template">
    <article class="review-panel">
      <header>
        <div>
          <span class="review-kicker"></span>
          <h3></h3>
        </div>
        <span class="review-badge">等待确认</span>
      </header>
      <pre class="review-draft"></pre>
      <textarea class="review-contract-editor" aria-label="任务合同 Markdown" hidden></textarea>
      <p class="review-error" role="alert"></p>
      <div class="review-actions">
        <button class="button button-primary approve-button" type="button">批准并继续</button>
        <button class="button button-secondary revise-toggle" type="button">提出修订</button>
      </div>
      <form class="revision-form" hidden>
        <div class="segmented" role="group" aria-label="修订方式">
          <button class="active" type="button" data-mode="feedback">反馈</button>
          <button type="button" data-mode="replacement">替换草稿</button>
        </div>
        <textarea class="revision-input" rows="4" placeholder="输入需要调整的内容"></textarea>
        <div class="revision-footer">
          <button class="button button-quiet cancel-revision" type="button">取消</button>
          <button class="button button-primary" type="submit">提交修订</button>
        </div>
      </form>
    </article>
  </template>

  <template id="plan-review-template">
    <article class="review-panel plan-review-panel">
      <header>
        <div>
          <span class="review-kicker">Plan review</span>
          <h3>Approve this plan and leave plan mode?</h3>
        </div>
        <span class="review-badge">等待确认</span>
      </header>
      <div class="plan-review-body"></div>
      <p class="review-error" role="alert"></p>
      <div class="review-actions">
        <button class="button button-primary plan-approve-button" type="button">Approve</button>
        <button class="button button-secondary plan-keep-toggle" type="button">Keep planning</button>
        <button class="button button-quiet plan-discuss-button" type="button">Chat about it</button>
      </div>
      <form class="revision-form" hidden>
        <textarea class="revision-input plan-feedback-input" rows="3" placeholder="输入需要调整的内容"></textarea>
        <div class="revision-footer">
          <button class="button button-quiet plan-cancel-keep" type="button">取消</button>
          <button class="button button-primary" type="submit">提交反馈</button>
        </div>
      </form>
    </article>
  </template>

  <template id="interrupt-template">
    <article class="review-panel interrupt-panel">
      <header>
        <div>
          <span class="review-kicker">已暂停</span>
          <h3>Agent 已打断</h3>
        </div>
        <span class="review-badge">已暂停</span>
      </header>
      <p class="interrupt-note">执行现场已保留，可继续执行或放弃本次任务。</p>
      <div class="review-actions">
        <button class="button button-primary continue-button" type="button">继续执行</button>
        <button class="button button-secondary abandon-button" type="button">放弃</button>
      </div>
    </article>
  </template>

  <template id="knowledge-template">
    <details class="knowledge-panel" open>
      <summary>
        <span class="knowledge-title">知识库证据（等级治理）</span>
        <span class="knowledge-query"></span>
      </summary>
      <ol class="knowledge-ledger"></ol>
      <p class="knowledge-notes" hidden></p>
    </details>
  </template>

  <template id="trace-template">
    <details class="trace-panel is-live" open>
      <summary>
        <span class="trace-summary-title">
          <span class="trace-live-dot" aria-hidden="true"></span>
          <span class="trace-state">思考中</span>
        </span>
        <span class="trace-summary-meta">
          <span class="trace-elapsed">已思考 0 秒</span>
          <span class="trace-count">0 项</span>
        </span>
      </summary>
      <ol class="trace-list"></ol>
    </details>
  </template>

  <section id="decision-table-panel" class="decision-table-panel" hidden role="dialog" aria-modal="false"
    aria-labelledby="decision-table-title" tabindex="-1" data-ui-surface="decision-table">
    <header>
      <strong id="decision-table-title">决策等级表</strong>
      <span id="decision-table-version" class="decision-table-version"></span>
      <button id="decision-table-close" class="icon-button icon-button-muted" type="button" aria-label="关闭" title="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div id="decision-table-body"></div>
  </section>

  <section id="plugin-panel" class="plugin-panel" hidden role="dialog" aria-modal="false"
    aria-labelledby="plugin-panel-title" tabindex="-1" data-ui-surface="plugins">
    <header>
      <strong id="plugin-panel-title">插件</strong>
      <span class="plugin-scope">调试视图</span>
      <button id="plugin-close" class="icon-button icon-button-muted" type="button" aria-label="关闭" title="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <h4>插件状态</h4>
    <div id="plugin-status-list"></div>
    <h4>执行参与链</h4>
    <ol id="plugin-trace-list" class="plugin-trace-list"></ol>
  </section>

  <section id="settings-window" class="settings-window" hidden role="dialog" aria-modal="false"
    aria-labelledby="settings-title" tabindex="-1" data-ui-surface="settings">
    <div class="settings-window-card">
      <header>
        <strong id="settings-title">设置</strong>
        <div class="settings-window-actions">
          <button id="open-config-file" class="button button-quiet" type="button">打开配置文件</button>
          <button id="settings-close" class="icon-button icon-button-muted" type="button" aria-label="关闭" title="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </header>
      <div class="settings-window-body">
        <nav class="settings-nav" aria-label="设置导航">
          <button type="button" class="settings-nav-item" data-settings-view="data">数据</button>
        </nav>
        <div class="settings-content">
          <div class="settings-page" data-settings-page="data">
            <div class="settings-sublinks">
              <button type="button" class="settings-sublink" id="open-archived">已归档的会话</button>
            </div>
          </div>
          <div class="settings-page" data-settings-page="archived" hidden>
            <button type="button" class="settings-back" id="back-to-data">← 数据</button>
            <h4>已归档的会话</h4>
            <div id="settings-archived-list" class="archived-list"></div>
          </div>
          <pre id="settings-config" class="settings-config" hidden></pre>
        </div>
      </div>
    </div>
  </section>

  <section id="confirm-panel" class="confirm-panel" hidden role="dialog" aria-modal="true"
    aria-labelledby="confirm-title">
    <div class="confirm-card">
      <strong id="confirm-title">删除会话</strong>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="button button-quiet" type="button">取消</button>
        <button id="confirm-ok" class="button button-danger" type="button">删除</button>
      </div>
    </div>
  </section>

  <script src="/assets/vendor/marked.min.js" defer></script>
  <script src="/assets/vendor/purify.min.js" defer></script>
  <script src="/assets/skills.js?v=goal-mode-1" defer></script>
  <script src="/assets/context-editor.js?v=f65-recency-1" defer></script>
  <script src="/assets/context-ui.js?v=f65-recency-1" defer></script>
  <script src="/assets/plugins.js?v=polish-2" defer></script>
  <script src="/assets/thread-list.js?v=f65-recency-2" defer></script>
  <script src="/assets/app.js?v=f65-recency-2" defer></script>
  <script src="/assets/settings.js?v=config-edit-1" defer></script>
  <script src="/assets/ui-polish.js?v=f64-settings-1" defer></script>
</body>
</html>
