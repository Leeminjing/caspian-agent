[project]
name = "caspian-harness"
version = "0.1.0"
description = "Caspian agent harness — caspian core runtime"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.3.0",
    "langchain-openai>=0.3.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.0",
    "pypdf>=5.0",
    "pypdfium2>=4.0",
    "pytesseract>=0.3",
    "python-docx>=1.0",
    "olefile>=0.47",
    "PyJWT>=2.0",
    "bcrypt>=4.0",
    "python-dotenv>=1.0",
    "duckduckgo-search>=8.0",
    "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "fastapi"]
mcp = ["langchain-mcp-adapters>=0.1.0", "mcp>=1.24,<2"]
postgres = ["asyncpg", "langgraph-checkpoint-postgres"]
sqlite = ["aiosqlite"]
aiosandbox = ["agent-sandbox", "docker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 需要真实 LLM / 网络 / 外部服务的用例,PR 默认排除",
]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["caspian*"]

[tool.setuptools.package-dir]
"" = "."
