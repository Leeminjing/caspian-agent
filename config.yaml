models:
  - name: deepseek-v4-flash
    display_name: Other OpenAI-compatible / deepseek-v4-flash
    use: caspian.models.deepseek:DeepSeekChatOpenAI
    model: deepseek-v4-flash
    api_key: $OPENAI_API_KEY
    base_url: https://api.deepseek.com

agent:
  recursion_limit: 300

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: shell

tools:
  - name: read_file
    group: file:read
    use: caspian.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: caspian.sandbox.tools:write_file_tool
  - name: bash
    group: shell
    use: caspian.sandbox.tools:bash_tool
  - name: powershell
    group: shell
    use: caspian.sandbox.tools:powershell_tool
  - name: cmd
    group: shell
    use: caspian.sandbox.tools:cmd_tool
  - name: sh
    group: shell
    use: caspian.sandbox.tools:sh_tool
  - name: web_search
    group: web
    use: caspian.web.tools:web_search_tool
  - name: web_fetch
    group: web
    use: caspian.web.tools:web_fetch_tool

skills:
  container_path: /mnt/skills

sandbox:
  # 沙箱后端由环境变量 CASPIAN_SANDBOX 决定（.env / .env.example 提供）：
  #   容器沙箱(默认): CASPIAN_SANDBOX=caspian.community.aio_sandbox.aio_sandbox:AioSandbox
  #   本机沙箱(开发): CASPIAN_SANDBOX=caspian.sandbox.local:LocalSandbox
  use: $CASPIAN_SANDBOX
  image: ghcr.io/agent-infra/sandbox:latest
  port: 8080
  replicas: 3
  container_prefix: caspian-sandbox
  # 额外 bind mount 与环境变量（默认空；按部署填写，mount 的 host_path 需真实存在）
  mounts: []
  environment: {}

commitment:
  enabled: true
  context7_url: https://mcp.context7.com/mcp

plan_mode:
  enabled: true
  section: |
    You are in plan mode. Explore and design before presenting the complete
    plan through exit_plan_mode. The user may approve (carry out the plan
    from your next step) or keep planning — their feedback comes back in the
    tool result; revise and present again.

goal_mode:
  enabled: true
  default_max_goal_rounds: 256
  blocked_after_consecutive_rounds: 3

context_compression:
  enabled: true
  trigger_tokens: 100000
  keep_messages: 20
  max_tokens_to_summarize: 4000
  summary_model: null
  summary_timeout_seconds: 120
  prune_max_chars: 800
  recovery_max_attempts: 1

subagents:
  # 内置 subagent 的默认超时秒数（自定义类型用自身值）
  timeout_seconds: 1800
  # 可选：覆盖全部 subagent 的默认最大轮数（None = 保持内置默认 general-purpose=150 / bash=60）
  # max_turns: 120
  # 单个 lead run 允许的 subagent 委托总数（1-50）
  max_total_per_run: 6
  # per-agent 覆盖（timeout_seconds / max_turns / model / skills）
  # agents:
  #   general-purpose:
  #     timeout_seconds: 1800
  #     max_turns: 160
  # 用户自定义 subagent 类型（description / system_prompt / tools / disallowed_tools / skills / model / max_turns / timeout_seconds）
  # custom_agents:
  #   my-analyst:
  #     description: 数据分析专家，用于需要多步数据处理的委托
  #     system_prompt: 你是数据分析专家。
  #     model: inherit

stream_bridge:
  type: memory
  queue_maxsize: 512

checkpointer:
  type: postgres

langgraph_store:
  backend: async_postgres
  vector_enabled: true
  embed: qwen3.7-text-embedding
  dims: 1024
  fields: ["$"]
  embed_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  embed_api_key: $DASHSCOPE_API_KEY

database:
  backend: postgres
  url: postgresql+asyncpg://caspian:qweasdzxc123@127.0.0.1:7221/caspian
  echo: false
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_pre_ping: true
  pool_recycle: -1
  isolation_level: READ COMMITTED

auth:
  jwt_secret: $JWT_SECRET
  token_expiry_days: 7
  cookie_name: access_token
  csrf_cookie_name: csrf_token
  login_limit_window: 60
  login_limit_max_attempts: 5

knowledge:
  level_policy:
    # 域名 → 等级：3=官方文档/官方公告，2=官方工程博客/论文，1=普通博客/社区，0=低质量。
    # 未列出的域名一律按"未评级"处理（不参与压制）。入库时 level 由该策略确定性派生。
    domains:
      "docs.example.com": 3
      "blog.example.com": 1
