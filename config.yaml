models:
  - name: deepseek-v4-flash
    display_name: Other OpenAI-compatible / deepseek-v4-flash
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4-flash
    api_key: $OPENAI_API_KEY
    base_url: https://api.deepseek.com

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: shell

tools:
  - name: read_file
    group: file:read
    use: lead_agent.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: lead_agent.sandbox.tools:write_file_tool
  - name: bash
    group: shell
    use: lead_agent.sandbox.tools:bash_tool
  - name: powershell
    group: shell
    use: lead_agent.sandbox.tools:powershell_tool
  - name: cmd
    group: shell
    use: lead_agent.sandbox.tools:cmd_tool
  - name: sh
    group: shell
    use: lead_agent.sandbox.tools:sh_tool

skills:
  container_path: /mnt/skills

sandbox:
  use: lead_agent.sandbox.local:LocalSandbox

stream_bridge:
  type: memory
  queue_maxsize: 512

checkpointer:
  type: postgres

langgraph_store:
  backend: async_postgres
  vector_enabled: true
  embed: text-embedding-v4
  dims: 1024
  fields: ["$"]

database:
  backend: postgres
  url: postgresql+asyncpg://caspian:qweasdzxc123@localhost:7221/caspian
  echo: false
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_pre_ping: true
  pool_recycle: -1
  isolation_level: READ COMMITTED
