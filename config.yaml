models:
  - name: deepseek-v4-flash
    display_name: Other OpenAI-compatible / deepseek-v4-flash
    use: langchain_openai:ChatOpenAI
    model: deepseek-v4-flash
    api_key: $OPENAI_API_KEY
    base_url: https://api.deepseek.com

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

tools:
  - name: read_file
    group: file:read
    use: lead_agent.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: lead_agent.sandbox.tools:write_file_tool
  - name: bash
    group: bash
    use: lead_agent.sandbox.tools:run_shell_tool

skills:
  container_path: /mnt/skills

sandbox:
  use: lead_agent.sandbox.local:LocalSandbox

stream_bridge:
  type: memory
  queue_maxsize: 512

database:
  backend: postgres
  url: postgresql+asyncpg://caspian:qweasdzxc123@localhost:5432/caspian
  echo: false
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_pre_ping: true
  pool_recycle: -1
  isolation_level: READ COMMITTED
