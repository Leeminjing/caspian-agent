:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);

  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.btn,

.btn {
  appearance: button;
  display: inline-flex;

  min-height: 28px;
  align-items: center;

}

  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {

.btn-ghost:not(:disabled):hover {

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;

[data-lucide] {

}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-select:focus-visible {

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;

  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);

  cursor: var(--cursor-interaction, default);

                &quot;id&quot;: &quot;lc_559c37b2-5e6e-412c-a614-ebef8a5a6da1&quot;,
                &quot;text&quot;: &quot;### Install React 19\n\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/blog/2024/04/25/react-19-upgrade-guide.md\n\nOfficial npm commands to install React 19 and its TypeScript types\n\n```bash\nnpm install --save-exact react@^19.0.0 react-dom@^19.0.0\n```\n\n--------------------------------\n\n### Full-Stack React Framework Recommendations\n\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/learn/creating-a-react-app.md\n\nOfficial React team guidance on choosing frameworks and build tool integration for React applications. Specifically recommends starting with a framework (Next.js, React Router, Expo) that integrate the latest React features and architecture, supporting both client-side and server-side rendering strategies.\n\n```markdown\n// Production-grade frameworks supporting TypeScript and full-stack React:\n// - Next.js (App Router) - full-stack React framework\n// - React Router (v7) - client routing paired with Vite\n// - Expo - for native apps (iOS, Android, web)\n\n// These frameworks integrate:\n// - React Server Components specification\n// - Suspense for data fetching\n// - Client-side rendering (CSR), Single-page apps (SPA), Static-site generation (SSG)\n// - Optional server-side rendering on a per-route basis\n```\n\n--------------------------------\n\n### TypeScript with React Components - Props Typing\n\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/learn/typescript.md\n\nOfficial React guidance on typing React components in TypeScript, showing how to provide types for component props using interfaces and inline syntax. Covers the recommended pattern of using interfaces for reusable component specifications.\n\n```typescript\ninterface MyButtonProps {\n  /** The text to display inside the button */\n  title: string;\n  /** Whether the button can be interacted with */\n  disabled: boolean;\n}\n\nfunction MyButton({ title, disabled }: MyButtonProps) {\n  return (\n    \u003cbutton disabled={disabled}\u003e{title}\u003c/button\u003e\n  );\n}\n```\n\n--------------------------------\n\n### Update react, react-dom, and react-server-dom-webpack together\n\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/blog/2025/12/03/critical-security-vulnerability-in-react-server-components.md\n\nFor a patch/security release, react, react-dom, and react-server-dom-webpack must all be updated together to the same version line. All three packages share a compatible exact-version dependency.\n\n```bash\nnpm install react@latest react-dom@latest react-server-dom-webpack@latest\n```\n\n--------------------------------\n\n### Create Next.js App\n\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/learn/creating-a-react-app.md\n\nOfficial command to create a new Next.js app with App Router (React&#x27;s recommended framework for full-stack React apps)\n\n```bash\nnpx create-next-app@latest\n```&quot;,
                &quot;type&quot;: &quot;text&quot;
              }
            ],
            &quot;version&quot;: &quot;19.2&quot;

              {
                &quot;id&quot;: &quot;lc_b71498b7-14a0-46b4-826b-51b5c8aa6744&quot;,
                &quot;text&quot;: &quot;### Next.js v16 주요 변경사항 및 기능\n\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/02-guides/upgrading/version-16.mdx\n\nv16의 핵심 변경사항: Turbopack 기본 번들러, React 19.2 (View Transitions, useEffectEvent, Activity), React Compiler 안정화, Node.js 20.9+ 필요, Async Request APIs 필수, 캐싱 API (cacheLife, cacheTag, use cache), Middleware에서 Proxy로 이름 변경 등.\n\n```markdown\n## Turbopack by default\n\nStarting with **Next.js 16**, Turbopack is stable and used by default with `next dev` and `next build`\n\n## React 19.2\n\nThe App Router in **Next.js 16** uses the latest React [Canary release](https://react.dev/blog/2023/05/03/react-canaries), which includes the newly released React 19.2 features and other features being incrementally stabilized. Highlights include:\n\n- **[View Transitions](https://react.dev/reference/react/ViewTransition)**: Animate elements that update inside a Transition or navigation\n- **[`useEffectEvent`](https://react.dev/reference/react/useEffectEvent)**: Extract non-reactive logic from Effects into reusable Effect Event functions\n- **[Activity](https://react.dev/reference/react/Activity)**: Render \&quot;background activity\&quot; by hiding UI with `display: none` while maintaining state and cleaning up Effects\n\n## React Compiler Support\n\nBuilt-in support for the React Compiler is now stable in **Next.js 16** following the React Compiler&#x27;s 1.0 release. The React Compiler automatically memoizes components, reducing unnecessary re-renders with zero manual code changes.\n\n## Caching APIs\n\nNew `\&quot;use cache\&quot;` directive replaces `unstable_cache`, `fetchCache`, and route segment configs like `revalidate`. The `cacheLife` and `cacheTag` APIs are stabilized (no longer need `unstable_` prefix).\n```\n\n--------------------------------\n\n### Manually Install Next.js 16 and React\n\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/02-guides/upgrading/version-16.mdx\n\nManually update Next.js and React dependencies to their latest versions. Ensure @types/react and @types/react-dom are also updated if using TypeScript.\n\n```bash\npnpm add next@latest react@latest react-dom@latest\n```\n\n```bash\nnpm install next@latest react@latest react-dom@latest\n```\n\n```bash\nyarn add next@latest react@latest react-dom@latest\n```\n\n```bash\nbun add next@latest react@latest react-dom@latest\n```\n\n--------------------------------\n\n### Configure default Next.js scripts in package.json\n\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/03-api-reference/08-turbopack.mdx\n\nTurbopack is the default bundler in Next.js, requiring no additional configuration in your standard scripts.\n\n```json\n{\n  \&quot;scripts\&quot;: {\n    \&quot;dev\&quot;: \&quot;next dev\&quot;,\n    \&quot;build\&quot;: \&quot;next build\&quot;,\n    \&quot;start\&quot;: \&quot;next start\&quot;\n  }\n}\n```\n\n--------------------------------\n\n### Configure Default Image Qualities in Next.js\n\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/03-api-reference/02-components/image.mdx\n\nSpecify the default allowed image quality values in `next.config.js`. This field is required starting with Next.js 16.\n\n```js\nmodule.exports = {\n  images: {\n    qualities: [75],\n  },\n}\n```\n\n--------------------------------\n\n### Semantic diagnostics gated on isAppEntry — non-entry files get no Next.js checks\n\nSource: https://github.com/vercel/next.js/blob/canary/packages/next/src/server/typescript/index.ts\n\nAll framework-specific diagnostic rules (entryConfig, metadata, clientBoundary, serverBoundary) are gated behind `isAppEntry` (line 185) or `isClientEntry`/`isServerEntry` (which also require being an app entry file). Non-page/layout modules bypass all of these checks entirely, confirming that normal TypeScript module changes need no Next-specific API changes.\n\n```typescript\nproxy.getSemanticDiagnostics = (fileName: string) =\u003e {\n  const prior = info.languageService.getSemanticDiagnostics(fileName)\n  const source = getSource(fileName)\n  if (!source) return prior\n\n  let isClientEntry = false\n  let isServerEntry = false\n  const isAppEntry = isAppEntryFile(fileName)\n\n  try {\n    const entryInfo = getEntryInfo(fileName, true)\n    isClientEntry = entryInfo.client\n    isServerEntry = entryInfo.server\n  } catch (e: any) {\n    prior.push({\n      file: source,\n      category: ts.DiagnosticCategory.Error,\n      code: NEXT_TS_ERRORS.MISPLACED_ENTRY_DIRECTIVE,\n      ...e,\n    })\n    isClientEntry = false\n    isServerEntry = false\n  }\n\n  if (isInsideApp(fileName)) {\n    const errorDiagnostic = errorEntry.getSemanticDiagnostics(\n      source!,\n      isClientEntry\n    )\n    prior.push(...errorDiagnostic)\n  }\n\n  ts.forEachChild(source!, (node) =\u003e {\n    if (ts.isImportDeclaration(node)) {\n      // import ...\n      if (isAppEntry) {\n        if (!isClientEntry || isServerEntry) {\n          // Check if it has valid imports in the server layer\n          const diagnostics =\n            serverLayer.getSemanticDiagnosticsForImportDeclaration(\n              source,\n              node\n            )\n          prior.push(...diagnostics)\n        }\n      }\n    } else if (\n      ts.isVariableStatement(node) \u0026\u0026\n      node.modifiers?.some((m) =\u003e m.kind === ts.SyntaxKind.ExportKeyword)\n    ) {\n      // export const ...\n      if (isAppEntry) {\n        // Check if it has correct option exports\n        const diagnostics =\n          entryConfig.getSemanticDiagnosticsForExportVariableStatement(\n            source,\n            node\n          )\n        const metadataDiagnostics = isClientEntry\n          ? metadata.client.getSemanticDiagnosticsForExportVariableStatement(\n              fileName,\n              node\n            )\n          : metadata.server.getSemanticDiagnosticsForExportVariableStatement(\n              fileName,\n              node\n            )\n        prior.push(...diagnostics, ...metadataDiagnostics)\n      }\n\n      if (isClientEntry) {\n        prior.push(\n          ...clientBoundary.getSemanticDiagnosticsForExportVariableStatement(\n            source,\n            node\n          )\n        )\n      }\n\n      if (isServerEntry) {\n        prior.push(\n          ...serverBoundary.getSemanticDiagnosticsForExportVariableStatement(\n            source,\n            node\n          )\n        )\n      }\n    } else if (isDefaultFunctionExport(node)) {\n      // export default function ...\n      if (isAppEntry) {\n        const diagnostics = entryDefault.getSemanticDiagnostics(\n          fileName,\n          ...\n```&quot;,

                &quot;text&quot;: &quot;### Upgrading Tailwind CSS\n\nSource: https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-2-1/index.mdx\n\nCommand to upgrade Tailwind CSS to the latest version.\n\n```bash\nnpm install tailwindcss@latest\n```\n\n--------------------------------\n\n### 1. Install Tailwind CSS\n\nSource: https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-v4/index.mdx\n\nCommand to install Tailwind CSS v4.0 and its PostCSS plugin.\n\n```shell\nnpm i tailwindcss @tailwindcss/postcss;\n```\n\n--------------------------------\n\n### Install Tailwind CSS v3.0\n\nSource: https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-v3/index.mdx\n\nCommand to install Tailwind CSS v3.0 along with PostCSS and Autoprefixer.\n\n```sh\nnpm install -D tailwindcss@latest postcss autoprefixer\n```\n\n--------------------------------\n\n### Standard Tailwind CSS directives\n\nSource: https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-1-6/index.mdx\n\nThe typical @tailwind directives found in a custom input CSS file.\n\n```css\n@tailwind base;\n@tailwind components;\n@tailwind utilities;\n```\n\n--------------------------------\n\n### Importing Tailwind CSS\n\nSource: https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-v4-alpha/index.mdx\n\nHow to import Tailwind CSS into your project using a regular CSS `@import` statement.\n\n```css\n@import \&quot;tailwindcss\&quot;;\n```&quot;,

                &quot;text&quot;: &quot;### getFrameworkVersion: Detects Next.js version for init command\n\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/utils/get-project-info.ts\n\nExtracts the Next.js version from package.json dependencies, enabling the CLI to detect Next.js 16+ and trigger the middleware-to-proxy rename.\n\n```typescript\nexport async function getFrameworkVersion(\n  framework: Framework,\n  packageJson: ReturnType\u003ctypeof getPackageInfo\u003e\n) {\n  if (!packageJson) {\n    return null\n  }\n\n  // Only detect Next.js version for now.\n  if (![\&quot;next-app\&quot;, \&quot;next-pages\&quot;].includes(framework.name)) {\n    return null\n  }\n\n  const version =\n    packageJson.dependencies?.next || packageJson.devDependencies?.next\n\n  if (!version) {\n    return null\n  }\n\n  // Extract full semver (major.minor.patch), handling ^, ~, etc.\n  const versionMatch = version.match(/^[\\^~]?(\\d+\\.\\d+\\.\\d+)/)\n  if (versionMatch) {\n    return versionMatch[1] // e.g., \&quot;16.0.0\&quot;\n  }\n\n  // For ranges like \&quot;\u003e=15.0.0 \u003c16.0.0\&quot;, extract the first version.\n  const rangeMatch = version.match(/(\\d+\\.\\d+\\.\\d+)/)\n  if (rangeMatch) {\n    return rangeMatch[1]\n  }\n\n  // For \&quot;latest\&quot;, \&quot;canary\&quot;, \&quot;rc\&quot;, etc., return the tag as-is.\n  return version\n}\n```\n\n--------------------------------\n\n### transformNext: Renames middleware to proxy in source code\n\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/utils/transformers/transform-next.ts\n\nAST transformer that renames `middleware` to `proxy` in function declarations, variable declarations, and export aliases for Next.js 16+ compatibility.\n\n```typescript\nimport { Transformer } from \&quot;@/src/utils/transformers\&quot;\n\nexport const transformNext: Transformer = async ({ sourceFile }) =\u003e {\n  // export function middleware.\n  sourceFile.getFunctions().forEach((func) =\u003e {\n    if (func.getName() === \&quot;middleware\&quot;) {\n      func.rename(\&quot;proxy\&quot;)\n    }\n  })\n\n  // export const middleware.\n  sourceFile.getVariableDeclarations().forEach((variable) =\u003e {\n    if (variable.getName() === \&quot;middleware\&quot;) {\n      variable.rename(\&quot;proxy\&quot;)\n    }\n  })\n\n  // export { handler as middleware }.\n  sourceFile.getExportDeclarations().forEach((exportDecl) =\u003e {\n    const namedExports = exportDecl.getNamedExports()\n    namedExports.forEach((namedExport) =\u003e {\n      if (namedExport.getName() === \&quot;middleware\&quot;) {\n        namedExport.setName(\&quot;proxy\&quot;)\n      }\n      const aliasNode = namedExport.getAliasNode()\n      if (aliasNode?.getText() === \&quot;middleware\&quot;) {\n        namedExport.setAlias(\&quot;proxy\&quot;)\n      }\n    })\n  })\n\n  return sourceFile\n}\n```\n\n--------------------------------\n\n### _isNext16Middleware and file rename: Guards middleware-to-proxy rename\n\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/utils/updaters/update-files.ts\n\nDetects root-level middleware.ts/js in Next.js 16+ projects, then renames the file from middleware.ts to proxy.ts and injects the transformNext AST transformer.\n\n```typescript\nfunction _isNext16Middleware(\n  filePath: string,\n  projectInfo: ProjectInfo | null,\n  config: Config\n) {\n  const isRootMiddleware =\n    filePath === path.join(config.resolvedPaths.cwd, \&quot;middleware.ts\&quot;) ||\n    filePath === path.join(config.resolvedPaths.cwd, \&quot;middleware.js\&quot;)\n\n  const isNextJs =\n    projectInfo?.framework.name === \&quot;next-app\&quot; ||\n    projectInfo?.framework.name === \&quot;next-pages\&quot;\n\n  if (!isRootMiddleware || !isNextJs || !projectInfo?.frameworkVersion) {\n    return false\n  }\n\n  const majorVersion = parseInt(projectInfo.frameworkVersion.split(\&quot;.\&quot;)[0])\n  const isNext16Plus = !isNaN(majorVersion) \u0026\u0026 majorVersion \u003e= 16\n\n  return isNext16Plus\n}\n```\n\n--------------------------------\n\n### Switch component composition (new-york-v4 style)\n\nSource: https://github.com/shadcn-ui/ui/blob/main/apps/v4/registry/new-york-v4/ui/switch.tsx\n\nThe official shadcn/ui Switch built on Radix UI SwitchPrimitive.Root and SwitchPrimitive.Thumb, with size variants (`sm` and `default`) and data-slot attributes.\n\n```typescript\n\&quot;use client\&quot;\n\nimport * as React from \&quot;react\&quot;\nimport { Switch as SwitchPrimitive } from \&quot;radix-ui\&quot;\n\nimport { cn } from \&quot;@/lib/utils\&quot;\n\nfunction Switch({\n  className,\n  size = \&quot;default\&quot;,\n  ...props\n}: React.ComponentProps\u003ctypeof SwitchPrimitive.Root\u003e \u0026 {\n  size?: \&quot;sm\&quot; | \&quot;default\&quot;\n}) {\n  return (\n    \u003cSwitchPrimitive.Root\n      data-slot=\&quot;switch\&quot;\n      data-size={size}\n      className={cn(\n        \&quot;peer group/switch inline-flex shrink-0 items-center rounded-full border border-transparent shadow-xs transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 data-[size=default]:h-[1.15rem] data-[size=default]:w-8 data-[size=sm]:h-3.5 data-[size=sm]:w-6 data-[state=checked]:bg-primary data-[state=unchecked]:bg-input dark:data-[state=unchecked]:bg-input/80\&quot;,\n        className\n      )}\n      {...props}\n    \u003e\n      \u003cSwitchPrimitive.Thumb\n        data-slot=\&quot;switch-thumb\&quot;\n        className={cn(\n          \&quot;pointer-events-none block rounded-full bg-background ring-0 transition-transform group-data-[size=default]/switch:size-4 group-data-[size=sm]/switch:size-3 data-[state=checked]:translate-x-[calc(100%-2px)] data-[state=unchecked]:translate-x-0 dark:data-[state=checked]:bg-primary-foreground dark:data-[state=unchecked]:bg-foreground\&quot;\n        )}\n      /\u003e\n    \u003c/SwitchPrimitive.Root\u003e\n  )\n}\n\nexport { Switch }\n```\n\n--------------------------------\n\n### preFlightAdd: components.json existence check\n\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/preflights/preflight-add.ts\n\nIf components.json exists and is valid, init is not required — the config is returned and used directly. If missing, a MISSING_CONFIG error is set. If invalid, it exits with a message telling the user to run init.\n\n```typescript\n  // Check for existing components.json file.\n  if (!fs.existsSync(path.resolve(options.cwd, \&quot;components.json\&quot;))) {\n    // Check if we&#x27;re in a monorepo root.\n    if (await isMonorepoRoot(options.cwd)) {\n      const targets = await getMonorepoTargets(options.cwd)\n      if (targets.length \u003e 0) {\n        formatMonorepoMessage(\&quot;add [component]\&quot;, targets)\n        process.exit(1)\n      }\n    }\n\n    errors[ERRORS.MISSING_CONFIG] = true\n    return {\n      errors,\n      config: null,\n    }\n  }\n\n  try {\n    const config = await getConfig(options.cwd)\n\n    return {\n      errors,\n      config: config!,\n    }\n  } catch (error) {\n    logger.break()\n    logger.error(\n      `An invalid ${highlighter.info(\n        \&quot;components.json\&quot;\n      )} file was found at ${highlighter.info(\n        options.cwd\n      )}.\\nBefore you can add components, you must create a valid ${highlighter.info(\n        \&quot;components.json\&quot;\n      )} file by running the ${highlighter.info(\&quot;init\&quot;)} command.`\n    )\n    logger.error(\n      `Learn more at ${highlighter.info(`${SHADCN_URL}/docs/components-json`)}.`\n    )\n    logger.break()\n    process.exit(1)\n  }\n```&quot;,

                &quot;text&quot;: &quot;### Cloudflare Turnstile Validation Edge Function (TypeScript)\n\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/functions/examples/cloudflare-turnstile.mdx\n\nImplements server-side validation for Cloudflare Turnstile tokens using a Supabase Edge Function. It verifies the token against Cloudflare&#x27;s &#x27;/siteverify&#x27; endpoint and requires a &#x27;CLOUDFLARE_SECRET_KEY&#x27; environment variable.\n\n```ts\nimport { withSupabase } from &#x27;npm:@supabase/server@^1&#x27;\n\nconsole.log(&#x27;Hello from Cloudflare Trunstile!&#x27;)\n\nfunction ips(req: Request) {\n  return req.headers.get(&#x27;x-forwarded-for&#x27;)?.split(/\\s*,\\s*/)\n}\n\n// `withSupabase` handles CORS and preflight requests for you.\nexport default {\n  fetch: withSupabase({ auth: &#x27;none&#x27; }, async (req) =\u003e {\n    const { token } = await req.json()\n    const clientIps = ips(req) || [&#x27;&#x27;]\n    const ip = clientIps[0]\n\n    // Validate the token by calling the\n    // \&quot;/siteverify\&quot; API endpoint.\n    let formData = new FormData()\n    formData.append(&#x27;secret&#x27;, Deno.env.get(&#x27;CLOUDFLARE_SECRET_KEY&#x27;) ?? &#x27;&#x27;)\n    formData.append(&#x27;response&#x27;, token)\n    formData.append(&#x27;remoteip&#x27;, ip)\n\n    const url = &#x27;https://challenges.cloudflare.com/turnstile/v0/siteverify&#x27;\n    const result = await fetch(url, {\n      body: formData,\n      method: &#x27;POST&#x27;,\n    })\n\n    const outcome = await result.json()\n    console.log(outcome)\n    if (outcome.success) {\n      return Response.json({ success: true })\n    }\n    return Response.json({ success: false })\n  }),\n}\n```\n\n--------------------------------\n\n### Initialize the Supabase client\n\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/getting-started/quickstarts/kotlin.mdx\n\nCreate a Supabase client instance using your project URL and publishable API key.\n\n```kotlin\nimport ...\n\nval supabase = createSupabaseClient(\n    supabaseUrl = \&quot;https://xyzcompany.supabase.co\&quot;,\n    supabaseKey = \&quot;your_publishable_key\&quot;\n  ) {\n    install(Postgrest)\n}\n...\n```\n\n--------------------------------\n\n### Correct Browser Client Implementation\n\nSource: https://github.com/supabase/supabase/blob/master/examples/prompts/nextjs-supabase-auth.md\n\nExample of how to correctly implement the Supabase browser client using `@supabase/ssr`.\n\n```typescript\nimport { createBrowserClient } from &#x27;@supabase/ssr&#x27;\n\nexport function createClient() {\n  return createBrowserClient(\n    process.env.NEXT_PUBLIC_SUPABASE_URL!,\n    process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY!\n  )\n}\n```\n\n--------------------------------\n\n### PUT /v1/projects/{PROJECT_REF}/ssl-enforcement\n\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/platform/ssl-enforcement.mdx\n\nUpdates the SSL enforcement status for a Supabase project&#x27;s database, either enabling or disabling it. This action triggers a fast database reboot.\n\n```APIDOC\n## PUT /v1/projects/{PROJECT_REF}/ssl-enforcement\n\n### Description\nUpdates the SSL enforcement status for a Supabase project&#x27;s database. Setting `database` to `true` enables SSL enforcement, while `false` disables it. This operation will cause a brief database reboot.\n\n### Method\nPUT\n\n### Endpoint\nhttps://api.supabase.com/v1/projects/{PROJECT_REF}/ssl-enforcement\n\n### Parameters\n#### Path Parameters\n- **PROJECT_REF** (string) - Required - The unique reference ID of your Supabase project.\n\n#### Request Body\n- **requestedConfig** (object) - Required - An object containing the desired configuration settings.\n  - **database** (boolean) - Required - Set to `true` to enable SSL enforcement, or `false` to disable it.\n\n### Request Example\n```json\n{\n  \&quot;requestedConfig\&quot;: {\n    \&quot;database\&quot;: true\n  }\n}\n```\n\n### Response\n#### Success Response (200)\n- **status** (string) - A message indicating the success of the update operation.\n\n#### Response Example\n```json\n{\n  \&quot;status\&quot;: \&quot;SSL enforcement updated successfully\&quot;\n}\n```\n```\n\n--------------------------------\n\n### Configure Supabase Environment Variables\n\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/getting-started/tutorials/with-nextjs.mdx\n\nSave your Supabase API URL and publishable key in a `.env.local` file at the project root for application access.\n\n```bash\nNEXT_PUBLIC_SUPABASE_URL=YOUR_SUPABASE_URL\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=YOUR_SUPABASE_PUBLISHABLE_KEY\n```&quot;,

  {
    &quot;actor&quot;: &quot;worker&quot;,

    &quot;detail&quot;: &quot;&quot;,
    &quot;event&quot;: &quot;output_delta_aggregated&quot;,

    &quot;payload&quot;: {
      &quot;aggregated_delta&quot;: &quot;{\n  \&quot;result\&quot;: {\n    \&quot;knowledge\&quot;: [\n      {\n        \&quot;technology\&quot;: \&quot;React\&quot;,\n        \&quot;version\&quot;: \&quot;19.2\&quot;,\n        \&quot;source_url\&quot;: \&quot;https://github.com/reactjs/react.dev/blob/main/src/content/blog/2024/04/25/react-19-upgrade-guide.md\&quot;,\n        \&quot;content\&quot;: \&quot;### Install React 19\\n\\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/blog/2024/04/25/react-19-upgrade-guide.md\\n\\nOfficial npm commands to install React 19 and its TypeScript types\\n\\n```bash\\nnpm install --save-exact react@^19.0.0 react-dom@^19.0.0\\n```\\n\\n--------------------------------\\n\\n### Full-Stack React Framework Recommendations\\n\\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/learn/creating-a-react-app.md\\n\\nOfficial React team guidance on choosing frameworks and build tool integration for React applications. Specifically recommends starting with a framework (Next.js, React Router, Expo) that integrate the latest React features and architecture, supporting both client-side and server-side rendering strategies.\\n\\n```markdown\\n// Production-grade frameworks supporting TypeScript and full-stack React:\\n// - Next.js (App Router) - full-stack React framework\\n// - React Router (v7) - client routing paired with Vite\\n// - Expo - for native apps (iOS, Android, web)\\n\\n// These frameworks integrate:\\n// - React Server Components specification\\n// - Suspense for data fetching\\n// - Client-side rendering (CSR), Single-page apps (SPA), Static-site generation (SSG)\\n// - Optional server-side rendering on a per-route basis\\n```\\n\\n--------------------------------\\n\\n### TypeScript with React Components - Props Typing\\n\\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/learn/typescript.md\\n\\nOfficial React guidance on typing React components in TypeScript, showing how to provide types for component props using interfaces and inline syntax. Covers the recommended pattern of using interfaces for reusable component specifications.\\n\\n```typescript\\ninterface MyButtonProps {\\n  /** The text to display inside the button */\\n  title: string;\\n  /** Whether the button can be interacted with */\\n  disabled: boolean;\\n}\\n\\nfunction MyButton({ title, disabled }: MyButtonProps) {\\n  return (\\n    \u003cbutton disabled={disabled}\u003e{title}\u003c/button\u003e\\n  );\\n}\\n```\\n\\n--------------------------------\\n\\n### Update react, react-dom, and react-server-dom-webpack together\\n\\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/blog/2025/12/03/critical-security-vulnerability-in-react-server-components.md\\n\\nFor a patch/security release, react, react-dom, and react-server-dom-webpack must all be updated together to the same version line. All three packages share a compatible exact-version dependency.\\n\\n```bash\\nnpm install react@latest react-dom@latest react-server-dom-webpack@latest\\n```\\n\\n--------------------------------\\n\\n### Create Next.js App\\n\\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/learn/creating-a-react-app.md\\n\\nOfficial command to create a new Next.js app with App Router (React&#x27;s recommended framework for full-stack React apps)\\n\\n```bash\\nnpx create-next-app@latest\\n```\&quot;\n      },\n      {\n        \&quot;technology\&quot;: \&quot;Next.js\&quot;,\n        \&quot;version\&quot;: \&quot;16.2.9\&quot;,\n        \&quot;source_url\&quot;: \&quot;https://github.com/vercel/next.js/blob/canary/docs/01-app/02-guides/upgrading/version-16.mdx\&quot;,\n        \&quot;content\&quot;: \&quot;### Next.js v16 주요 변경사항 및 기능\\n\\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/02-guides/upgrading/version-16.mdx\\n\\nv16의 핵심 변경사항: Turbopack 기본 번들러, React 19.2 (View Transitions, useEffectEvent, Activity), React Compiler 안정화, Node.js 20.9+ 필요, Async Request APIs 필수, 캐싱 API (cacheLife, cacheTag, use cache), Middleware에서 Proxy로 이름 변경 등.\\n\\n```markdown\\n## Turbopack by default\\n\\nStarting with **Next.js 16**, Turbopack is stable and used by default with `next dev` and `next build`\\n\\n## React 19.2\\n\\nThe App Router in **Next.js 16** uses the latest React [Canary release](https://react.dev/blog/2023/05/03/react-canaries), which includes the newly released React 19.2 features and other features being incrementally stabilized. Highlights include:\\n\\n- **[View Transitions](https://react.dev/reference/react/ViewTransition)**: Animate elements that update inside a Transition or navigation\\n- **[`useEffectEvent`](https://react.dev/reference/react/useEffectEvent)**: Extract non-reactive logic from Effects into reusable Effect Event functions\\n- **[Activity](https://react.dev/reference/react/Activity)**: Render \\\&quot;background activity\\\&quot; by hiding UI with `display: none` while maintaining state and cleaning up Effects\\n\\n## React Compiler Support\\n\\nBuilt-in support for the React Compiler is now stable in **Next.js 16** following the React Compiler&#x27;s 1.0 release. The React Compiler automatically memoizes components, reducing unnecessary re-renders with zero manual code changes.\\n\\n## Caching APIs\\n\\nNew `\\\&quot;use cache\\\&quot;` directive replaces `unstable_cache`, `fetchCache`, and route segment configs like `revalidate`. The `cacheLife` and `cacheTag` APIs are stabilized (no longer need `unstable_` prefix).\\n```\\n\\n--------------------------------\\n\\n### Manually Install Next.js 16 and React\\n\\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/02-guides/upgrading/version-16.mdx\\n\\nManually update Next.js and React dependencies to their latest versions. Ensure @types/react and @types/react-dom are also updated if using TypeScript.\\n\\n```bash\\npnpm add next@latest react@latest react-dom@latest\\n```\\n\\n```bash\\nnpm install next@latest react@latest react-dom@latest\\n```\\n\\n```bash\\nyarn add next@latest react@latest react-dom@latest\\n```\\n\\n```bash\\nbun add next@latest react@latest react-dom@latest\\n```\\n\\n--------------------------------\\n\\n### Configure default Next.js scripts in package.json\\n\\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/03-api-reference/08-turbopack.mdx\\n\\nTurbopack is the default bundler in Next.js, requiring no additional configuration in your standard scripts.\\n\\n```json\\n{\\n  \\\&quot;scripts\\\&quot;: {\\n    \\\&quot;dev\\\&quot;: \\\&quot;next dev\\\&quot;,\\n    \\\&quot;build\\\&quot;: \\\&quot;next build\\\&quot;,\\n    \\\&quot;start\\\&quot;: \\\&quot;next start\\\&quot;\\n  }\\n}\\n```\\n\\n--------------------------------\\n\\n### Configure Default Image Qualities in Next.js\\n\\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/03-api-reference/02-components/image.mdx\\n\\nSpecify the default allowed image quality values in `next.config.js`. This field is required starting with Next.js 16.\\n\\n```js\\nmodule.exports = {\\n  images: {\\n    qualities: [75],\\n  },\\n}\\n```\\n\\n--------------------------------\\n\\n### Semantic diagnostics gated on isAppEntry — non-entry files get no Next.js checks\\n\\nSource: https://github.com/vercel/next.js/blob/canary/packages/next/src/server/typescript/index.ts\\n\\nAll framework-specific diagnostic rules (entryConfig, metadata, clientBoundary, serverBoundary) are gated behind `isAppEntry` (line 185) or `isClientEntry`/`isServerEntry` (which also require being an app entry file). Non-page/layout modules bypass all of these checks entirely, confirming that normal TypeScript module changes need no Next-specific API changes.\\n\\n```typescript\\nproxy.getSemanticDiagnostics = (fileName: string) =\u003e {\\n  const prior = info.languageService.getSemanticDiagnostics(fileName)\\n  const source = getSource(fileName)\\n  if (!source) return prior\\n\\n  let isClientEntry = false\\n  let isServerEntry = false\\n  const isAppEntry = isAppEntryFile(fileName)\\n\\n  try {\\n    const entryInfo = getEntryInfo(fileName, true)\\n    isClientEntry = entryInfo.client\\n    isServerEntry = entryInfo.server\\n  } catch (e: any) {\\n    prior.push({\\n      file: source,\\n      category: ts.DiagnosticCategory.Error,\\n      code: NEXT_TS_ERRORS.MISPLACED_ENTRY_DIRECTIVE,\\n      ...e,\\n    })\\n    isClientEntry = false\\n    isServerEntry = false\\n  }\\n\\n  if (isInsideApp(fileName)) {\\n    const errorDiagnostic = errorEntry.getSemanticDiagnostics(\\n      source!,\\n      isClientEntry\\n    )\\n    prior.push(...errorDiagnostic)\\n  }\\n\\n  ts.forEachChild(source!, (node) =\u003e {\\n    if (ts.isImportDeclaration(node)) {\\n      // import ...\\n      if (isAppEntry) {\\n        if (!isClientEntry || isServerEntry) {\\n          // Check if it has valid imports in the server layer\\n          const diagnostics =\\n            serverLayer.getSemanticDiagnosticsForImportDeclaration(\\n              source,\\n              node\\n            )\\n          prior.push(...diagnostics)\\n        }\\n      }\\n    } else if (\\n      ts.isVariableStatement(node) \u0026\u0026\\n      node.modifiers?.some((m) =\u003e m.kind === ts.SyntaxKind.ExportKeyword)\\n    ) {\\n      // export const ...\\n      if (isAppEntry) {\\n        // Check if it has correct option exports\\n        const diagnostics =\\n          entryConfig.getSemanticDiagnosticsForExportVariableStatement(\\n            source,\\n            node\\n          )\\n        const metadataDiagnostics = isClientEntry\\n          ? metadata.client.getSemanticDiagnosticsForExportVariableStatement(\\n              fileName,\\n              node\\n            )\\n          : metadata.server.getSemanticDiagnosticsForExportVariableStatement(\\n              fileName,\\n              node\\n            )\\n        prior.push(...diagnostics, ...metadataDiagnostics)\\n      }\\n\\n      if (isClientEntry) {\\n        prior.push(\\n          ...clientBoundary.getSemanticDiagnosticsForExportVariableStatement(\\n            source,\\n            node\\n          )\\n        )\\n      }\\n\\n      if (isServerEntry) {\\n        prior.push(\\n          ...serverBoundary.getSemanticDiagnosticsForExportVariableStatement(\\n            source,\\n            node\\n          )\\n        )\\n      }\\n    } else if (isDefaultFunctionExport(node)) {\\n      // export default function ...\\n      if (isAppEntry) {\\n        const diagnostics = entryDefault.getSemanticDiagnostics(\\n          fileName,\\n          ...\\n```\&quot;\n      },\n      {\n        \&quot;technology\&quot;: \&quot;Tailwind CSS\&quot;,\n        \&quot;version\&quot;: \&quot;latest-stable\&quot;,\n        \&quot;source_url\&quot;: \&quot;https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-2-1/index.mdx\&quot;,\n        \&quot;content\&quot;: \&quot;### Upgrading Tailwind CSS\\n\\nSource: https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-2-1/index.mdx\\n\\nCommand to upgrade Tailwind CSS to the latest version.\\n\\n```bash\\nnpm install tailwindcss@latest\\n```\\n\\n--------------------------------\\n\\n### 1. Install Tailwind CSS\\n\\nSource: https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-v4/index.mdx\\n\\nCommand to install Tailwind CSS v4.0 and its PostCSS plugin.\\n\\n```shell\\nnpm i tailwindcss @tailwindcss/postcss;\\n```\\n\\n--------------------------------\\n\\n### Install Tailwind CSS v3.0\\n\\nSource: https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-v3/index.mdx\\n\\nCommand to install Tailwind CSS v3.0 along with PostCSS and Autoprefixer.\\n\\n```sh\\nnpm install -D tailwindcss@latest postcss autoprefixer\\n```\\n\\n--------------------------------\\n\\n### Standard Tailwind CSS directives\\n\\nSource: https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-1-6/index.mdx\\n\\nThe typical @tailwind directives found in a custom input CSS file.\\n\\n```css\\n@tailwind base;\\n@tailwind components;\\n@tailwind utilities;\\n```\\n\\n--------------------------------\\n\\n### Importing Tailwind CSS\\n\\nSource: https://github.com/tailwindlabs/tailwindcss.com/blob/main/src/blog/tailwindcss-v4-alpha/index.mdx\\n\\nHow to import Tailwind CSS into your project using a regular CSS `@import` statement.\\n\\n```css\\n@import \\\&quot;tailwindcss\\\&quot;;\\n```\&quot;\n      },\n      {\n        \&quot;technology\&quot;: \&quot;shadcn/ui\&quot;,\n        \&quot;version\&quot;: \&quot;3.5.0\&quot;,\n        \&quot;source_url\&quot;: \&quot;https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/utils/get-project-info.ts\&quot;,\n        \&quot;content\&quot;: \&quot;### getFrameworkVersion: Detects Next.js version for init command\\n\\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/utils/get-project-info.ts\\n\\nExtracts the Next.js version from package.json dependencies, enabling the CLI to detect Next.js 16+ and trigger the middleware-to-proxy rename.\\n\\n```typescript\\nexport async function getFrameworkVersion(\\n  framework: Framework,\\n  packageJson: ReturnType\u003ctypeof getPackageInfo\u003e\\n) {\\n  if (!packageJson) {\\n    return null\\n  }\\n\\n  // Only detect Next.js version for now.\\n  if (![\\\&quot;next-app\\\&quot;, \\\&quot;next-pages\\\&quot;].includes(framework.name)) {\\n    return null\\n  }\\n\\n  const version =\\n    packageJson.dependencies?.next || packageJson.devDependencies?.next\\n\\n  if (!version) {\\n    return null\\n  }\\n\\n  // Extract full semver (major.minor.patch), handling ^, ~, etc.\\n  const versionMatch = version.match(/^[\\\\^~]?(\\\\d+\\\\.\\\\d+\\\\.\\\\d+)/)\\n  if (versionMatch) {\\n    return versionMatch[1] // e.g., \\\&quot;16.0.0\\\&quot;\\n  }\\n\\n  // For ranges like \\\&quot;\u003e=15.0.0 \u003c16.0.0\\\&quot;, extract the first version.\\n  const rangeMatch = version.match(/(\\\\d+\\\\.\\\\d+\\\\.\\\\d+)/)\\n  if (rangeMatch) {\\n    return rangeMatch[1]\\n  }\\n\\n  // For \\\&quot;latest\\\&quot;, \\\&quot;canary\\\&quot;, \\\&quot;rc\\\&quot;, etc., return the tag as-is.\\n  return version\\n}\\n```\\n\\n--------------------------------\\n\\n### transformNext: Renames middleware to proxy in source code\\n\\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/utils/transformers/transform-next.ts\\n\\nAST transformer that renames `middleware` to `proxy` in function declarations, variable declarations, and export aliases for Next.js 16+ compatibility.\\n\\n```typescript\\nimport { Transformer } from \\\&quot;@/src/utils/transformers\\\&quot;\\n\\nexport const transformNext: Transformer = async ({ sourceFile }) =\u003e {\\n  // export function middleware.\\n  sourceFile.getFunctions().forEach((func) =\u003e {\\n    if (func.getName() === \\\&quot;middleware\\\&quot;) {\\n      func.rename(\\\&quot;proxy\\\&quot;)\\n    }\\n  })\\n\\n  // export const middleware.\\n  sourceFile.getVariableDeclarations().forEach((variable) =\u003e {\\n    if (variable.getName() === \\\&quot;middleware\\\&quot;) {\\n      variable.rename(\\\&quot;proxy\\\&quot;)\\n    }\\n  })\\n\\n  // export { handler as middleware }.\\n  sourceFile.getExportDeclarations().forEach((exportDecl) =\u003e {\\n    const namedExports = exportDecl.getNamedExports()\\n    namedExports.forEach((namedExport) =\u003e {\\n      if (namedExport.getName() === \\\&quot;middleware\\\&quot;) {\\n        namedExport.setName(\\\&quot;proxy\\\&quot;)\\n      }\\n      const aliasNode = namedExport.getAliasNode()\\n      if (aliasNode?.getText() === \\\&quot;middleware\\\&quot;) {\\n        namedExport.setAlias(\\\&quot;proxy\\\&quot;)\\n      }\\n    })\\n  })\\n\\n  return sourceFile\\n}\\n```\\n\\n--------------------------------\\n\\n### _isNext16Middleware and file rename: Guards middleware-to-proxy rename\\n\\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/utils/updaters/update-files.ts\\n\\nDetects root-level middleware.ts/js in Next.js 16+ projects, then renames the file from middleware.ts to proxy.ts and injects the transformNext AST transformer.\\n\\n```typescript\\nfunction _isNext16Middleware(\\n  filePath: string,\\n  projectInfo: ProjectInfo | null,\\n  config: Config\\n) {\\n  const isRootMiddleware =\\n    filePath === path.join(config.resolvedPaths.cwd, \\\&quot;middleware.ts\\\&quot;) ||\\n    filePath === path.join(config.resolvedPaths.cwd, \\\&quot;middleware.js\\\&quot;)\\n\\n  const isNextJs =\\n    projectInfo?.framework.name === \\\&quot;next-app\\\&quot; ||\\n    projectInfo?.framework.name === \\\&quot;next-pages\\\&quot;\\n\\n  if (!isRootMiddleware || !isNextJs || !projectInfo?.frameworkVersion) {\\n    return false\\n  }\\n\\n  const majorVersion = parseInt(projectInfo.frameworkVersion.split(\\\&quot;.\\\&quot;)[0])\\n  const isNext16Plus = !isNaN(majorVersion) \u0026\u0026 majorVersion \u003e= 16\\n\\n  return isNext16Plus\\n}\\n```\\n\\n--------------------------------\\n\\n### Switch component composition (new-york-v4 style)\\n\\nSource: https://github.com/shadcn-ui/ui/blob/main/apps/v4/registry/new-york-v4/ui/switch.tsx\\n\\nThe official shadcn/ui Switch built on Radix UI SwitchPrimitive.Root and SwitchPrimitive.Thumb, with size variants (`sm` and `default`) and data-slot attributes.\\n\\n```typescript\\n\\\&quot;use client\\\&quot;\\n\\nimport * as React from \\\&quot;react\\\&quot;\\nimport { Switch as SwitchPrimitive } from \\\&quot;radix-ui\\\&quot;\\n\\nimport { cn } from \\\&quot;@/lib/utils\\\&quot;\\n\\nfunction Switch({\\n  className,\\n  size = \\\&quot;default\\\&quot;,\\n  ...props\\n}: React.ComponentProps\u003ctypeof SwitchPrimitive.Root\u003e \u0026 {\\n  size?: \\\&quot;sm\\\&quot; | \\\&quot;default\\\&quot;\\n}) {\\n  return (\\n    \u003cSwitchPrimitive.Root\\n      data-slot=\\\&quot;switch\\\&quot;\\n      data-size={size}\\n      className={cn(\\n        \\\&quot;peer group/switch inline-flex shrink-0 items-center rounded-full border border-transparent shadow-xs transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 data-[size=default]:h-[1.15rem] data-[size=default]:w-8 data-[size=sm]:h-3.5 data-[size=sm]:w-6 data-[state=checked]:bg-primary data-[state=unchecked]:bg-input dark:data-[state=unchecked]:bg-input/80\\\&quot;,\\n        className\\n      )}\\n      {...props}\\n    \u003e\\n      \u003cSwitchPrimitive.Thumb\\n        data-slot=\\\&quot;switch-thumb\\\&quot;\\n        className={cn(\\n          \\\&quot;pointer-events-none block rounded-full bg-background ring-0 transition-transform group-data-[size=default]/switch:size-4 group-data-[size=sm]/switch:size-3 data-[state=checked]:translate-x-[calc(100%-2px)] data-[state=unchecked]:translate-x-0 dark:data-[state=checked]:bg-primary-foreground dark:data-[state=unchecked]:bg-foreground\\\&quot;\\n        )}\\n      /\u003e\\n    \u003c/SwitchPrimitive.Root\u003e\\n  )\\n}\\n\\nexport { Switch }\\n```\\n\\n--------------------------------\\n\\n### preFlightAdd: components.json existence check\\n\\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/preflights/preflight-add.ts\\n\\nIf components.json exists and is valid, init is not required — the config is returned and used directly. If missing, a MISSING_CONFIG error is set. If invalid, it exits with a message telling the user to run init.\\n\\n```typescript\\n  // Check for existing components.json file.\\n  if (!fs.existsSync(path.resolve(options.cwd, \\\&quot;components.json\\\&quot;))) {\\n    // Check if we&#x27;re in a monorepo root.\\n    if (await isMonorepoRoot(options.cwd)) {\\n      const targets = await getMonorepoTargets(options.cwd)\\n      if (targets.length \u003e 0) {\\n        formatMonorepoMessage(\\\&quot;add [component]\\\&quot;, targets)\\n        process.exit(1)\\n      }\\n    }\\n\\n    errors[ERRORS.MISSING_CONFIG] = true\\n    return {\\n      errors,\\n      config: null,\\n    }\\n  }\\n\\n  try {\\n    const config = await getConfig(options.cwd)\\n\\n    return {\\n      errors,\\n      config: config!,\\n    }\\n  } catch (error) {\\n    logger.break()\\n    logger.error(\\n      `An invalid ${highlighter.info(\\n        \\\&quot;components.json\\\&quot;\\n      )} file was found at ${highlighter.info(\\n        options.cwd\\n      )}.\\\\nBefore you can add components, you must create a valid ${highlighter.info(\\n        \\\&quot;components.json\\\&quot;\\n      )} file by running the ${highlighter.info(\\\&quot;init\\\&quot;)} command.`\\n    )\\n    logger.error(\\n      `Learn more at ${highlighter.info(`${SHADCN_URL}/docs/components-json`)}.`\\n    )\\n    logger.break()\\n    process.exit(1)\\n  }\\n```\&quot;\n      },\n      {\n        \&quot;technology\&quot;: \&quot;Supabase\&quot;,\n        \&quot;version\&quot;: \&quot;1.26.04\&quot;,\n        \&quot;source_url\&quot;: \&quot;https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/functions/examples/cloudflare-turnstile.mdx\&quot;,\n        \&quot;content\&quot;: \&quot;### Cloudflare Turnstile Validation Edge Function (TypeScript)\\n\\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/functions/examples/cloudflare-turnstile.mdx\\n\\nImplements server-side validation for Cloudflare Turnstile tokens using a Supabase Edge Function. It verifies the token against Cloudflare&#x27;s &#x27;/siteverify&#x27; endpoint and requires a &#x27;CLOUDFLARE_SECRET_KEY&#x27; environment variable.\\n\\n```ts\\nimport { withSupabase } from &#x27;npm:@supabase/server@^1&#x27;\\n\\nconsole.log(&#x27;Hello from Cloudflare Trunstile!&#x27;)\\n\\nfunction ips(req: Request) {\\n  return req.headers.get(&#x27;x-forwarded-for&#x27;)?.split(/\\\\s*,\\\\s*/)\\n}\\n\\n// `withSupabase` handles CORS and preflight requests for you.\\nexport default {\\n  fetch: withSupabase({ auth: &#x27;none&#x27; }, async (req) =\u003e {\\n    const { token } = await req.json()\\n    const clientIps = ips(req) || [&#x27;&#x27;]\\n    const ip = clientIps[0]\\n\\n    // Validate the token by calling the\\n    // \\\&quot;/siteverify\\\&quot; API endpoint.\\n    let formData = new FormData()\\n    formData.append(&#x27;secret&#x27;, Deno.env.get(&#x27;CLOUDFLARE_SECRET_KEY&#x27;) ?? &#x27;&#x27;)\\n    formData.append(&#x27;response&#x27;, token)\\n    formData.append(&#x27;remoteip&#x27;, ip)\\n\\n    const url = &#x27;https://challenges.cloudflare.com/turnstile/v0/siteverify&#x27;\\n    const result = await fetch(url, {\\n      body: formData,\\n      method: &#x27;POST&#x27;,\\n    })\\n\\n    const outcome = await result.json()\\n    console.log(outcome)\\n    if (outcome.success) {\\n      return Response.json({ success: true })\\n    }\\n    return Response.json({ success: false })\\n  }),\\n}\\n```\\n\\n--------------------------------\\n\\n### Initialize the Supabase client\\n\\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/getting-started/quickstarts/kotlin.mdx\\n\\nCreate a Supabase client instance using your project URL and publishable API key.\\n\\n```kotlin\\nimport ...\\n\\nval supabase = createSupabaseClient(\\n    supabaseUrl = \\\&quot;https://xyzcompany.supabase.co\\\&quot;,\\n    supabaseKey = \\\&quot;your_publishable_key\\\&quot;\\n  ) {\\n    install(Postgrest)\\n}\\n...\\n```\\n\\n--------------------------------\\n\\n### Correct Browser Client Implementation\\n\\nSource: https://github.com/supabase/supabase/blob/master/examples/prompts/nextjs-supabase-auth.md\\n\\nExample of how to correctly implement the Supabase browser client using `@supabase/ssr`.\\n\\n```typescript\\nimport { createBrowserClient } from &#x27;@supabase/ssr&#x27;\\n\\nexport function createClient() {\\n  return createBrowserClient(\\n    process.env.NEXT_PUBLIC_SUPABASE_URL!,\\n    process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY!\\n  )\\n}\\n```\\n\\n--------------------------------\\n\\n### PUT /v1/projects/{PROJECT_REF}/ssl-enforcement\\n\\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/platform/ssl-enforcement.mdx\\n\\nUpdates the SSL enforcement status for a Supabase project&#x27;s database, either enabling or disabling it. This action triggers a fast database reboot.\\n\\n```APIDOC\\n## PUT /v1/projects/{PROJECT_REF}/ssl-enforcement\\n\\n### Description\\nUpdates the SSL enforcement status for a Supabase project&#x27;s database. Setting `database` to `true` enables SSL enforcement, while `false` disables it. This operation will cause a brief database reboot.\\n\\n### Method\\nPUT\\n\\n### Endpoint\\nhttps://api.supabase.com/v1/projects/{PROJECT_REF}/ssl-enforcement\\n\\n### Parameters\\n#### Path Parameters\\n- **PROJECT_REF** (string) - Required - The unique reference ID of your Supabase project.\\n\\n#### Request Body\\n- **requestedConfig** (object) - Required - An object containing the desired configuration settings.\\n  - **database** (boolean) - Required - Set to `true` to enable SSL enforcement, or `false` to disable it.\\n\\n### Request Example\\n```json\\n{\\n  \\\&quot;requestedConfig\\\&quot;: {\\n    \\\&quot;database\\\&quot;: true\\n  }\\n}\\n```\\n\\n### Response\\n#### Success Response (200)\\n- **status** (string) - A message indicating the success of the update operation.\\n\\n#### Response Example\\n```json\\n{\\n  \\\&quot;status\\\&quot;: \\\&quot;SSL enforcement updated successfully\\\&quot;\\n}\\n```\\n```\\n\\n--------------------------------\\n\\n### Configure Supabase Environment Variables\\n\\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/getting-started/tutorials/with-nextjs.mdx\\n\\nSave your Supabase API URL and publishable key in a `.env.local` file at the project root for application access.\\n\\n```bash\\nNEXT               &quot;content&quot;: &quot;### Install React 19\n\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/blog/2024/04/25/react-19-upgrade-guide.md\n\nOfficial npm commands to install React 19 and its TypeScript types\n\n```bash\nnpm install --save-exact react@^19.0.0 react-dom@^19.0.0\n```\n\n--------------------------------\n\n### Full-Stack React Framework Recommendations\n\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/learn/creating-a-react-app.md\n\nOfficial React team guidance on choosing frameworks and build tool integration for React applications. Specifically recommends starting with a framework (Next.js, React Router, Expo) that integrate the latest React features and architecture, supporting both client-side and server-side rendering strategies.\n\n```markdown\n// Production-grade frameworks supporting TypeScript and full-stack React:\n// - Next.js (App Router) - full-stack React framework\n// - React Router (v7) - client routing paired with Vite\n// - Expo - for native apps (iOS, Android, web)\n\n// These frameworks integrate:\n// - React Server Components specification\n// - Suspense for data fetching\n// - Client-side rendering (CSR), Single-page apps (SPA), Static-site generation (SSG)\n// - Optional server-side rendering on a per-route basis\n```\n\n--------------------------------\n\n### TypeScript with React Components - Props Typing\n\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/learn/typescript.md\n\nOfficial React guidance on typing React components in TypeScript, showing how to provide types for component props using interfaces and inline syntax. Covers the recommended pattern of using interfaces for reusable component specifications.\n\n```typescript\ninterface MyButtonProps {\n  /** The text to display inside the button */\n  title: string;\n  /** Whether the button can be interacted with */\n  disabled: boolean;\n}\n\nfunction MyButton({ title, disabled }: MyButtonProps) {\n  return (\n    \u003cbutton disabled={disabled}\u003e{title}\u003c/button\u003e\n  );\n}\n```\n\n--------------------------------\n\n### Update react, react-dom, and react-server-dom-webpack together\n\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/blog/2025/12/03/critical-security-vulnerability-in-react-server-components.md\n\nFor a patch/security release, react, react-dom, and react-server-dom-webpack must all be updated together to the same version line. All three packages share a compatible exact-version dependency.\n\n```bash\nnpm install react@latest react-dom@latest react-server-dom-webpack@latest\n```\n\n--------------------------------\n\n### Create Next.js App\n\nSource: https://github.com/reactjs/react.dev/blob/main/src/content/learn/creating-a-react-app.md\n\nOfficial command to create a new Next.js app with App Router (React&#x27;s recommended framework for full-stack React apps)\n\n```bash\nnpx create-next-app@latest\n```&quot;,

              &quot;content&quot;: &quot;### Next.js v16 주요 변경사항 및 기능\n\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/02-guides/upgrading/version-16.mdx\n\nv16의 핵심 변경사항: Turbopack 기본 번들러, React 19.2 (View Transitions, useEffectEvent, Activity), React Compiler 안정화, Node.js 20.9+ 필요, Async Request APIs 필수, 캐싱 API (cacheLife, cacheTag, use cache), Middleware에서 Proxy로 이름 변경 등.\n\n```markdown\n## Turbopack by default\n\nStarting with **Next.js 16**, Turbopack is stable and used by default with `next dev` and `next build`\n\n## React 19.2\n\nThe App Router in **Next.js 16** uses the latest React [Canary release](https://react.dev/blog/2023/05/03/react-canaries), which includes the newly released React 19.2 features and other features being incrementally stabilized. Highlights include:\n\n- **[View Transitions](https://react.dev/reference/react/ViewTransition)**: Animate elements that update inside a Transition or navigation\n- **[`useEffectEvent`](https://react.dev/reference/react/useEffectEvent)**: Extract non-reactive logic from Effects into reusable Effect Event functions\n- **[Activity](https://react.dev/reference/react/Activity)**: Render \&quot;background activity\&quot; by hiding UI with `display: none` while maintaining state and cleaning up Effects\n\n## React Compiler Support\n\nBuilt-in support for the React Compiler is now stable in **Next.js 16** following the React Compiler&#x27;s 1.0 release. The React Compiler automatically memoizes components, reducing unnecessary re-renders with zero manual code changes.\n\n## Caching APIs\n\nNew `\&quot;use cache\&quot;` directive replaces `unstable_cache`, `fetchCache`, and route segment configs like `revalidate`. The `cacheLife` and `cacheTag` APIs are stabilized (no longer need `unstable_` prefix).\n```\n\n--------------------------------\n\n### Manually Install Next.js 16 and React\n\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/02-guides/upgrading/version-16.mdx\n\nManually update Next.js and React dependencies to their latest versions. Ensure @types/react and @types/react-dom are also updated if using TypeScript.\n\n```bash\npnpm add next@latest react@latest react-dom@latest\n```\n\n```bash\nnpm install next@latest react@latest react-dom@latest\n```\n\n```bash\nyarn add next@latest react@latest react-dom@latest\n```\n\n```bash\nbun add next@latest react@latest react-dom@latest\n```\n\n--------------------------------\n\n### Configure default Next.js scripts in package.json\n\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/03-api-reference/08-turbopack.mdx\n\nTurbopack is the default bundler in Next.js, requiring no additional configuration in your standard scripts.\n\n```json\n{\n  \&quot;scripts\&quot;: {\n    \&quot;dev\&quot;: \&quot;next dev\&quot;,\n    \&quot;build\&quot;: \&quot;next build\&quot;,\n    \&quot;start\&quot;: \&quot;next start\&quot;\n  }\n}\n```\n\n--------------------------------\n\n### Configure Default Image Qualities in Next.js\n\nSource: https://github.com/vercel/next.js/blob/canary/docs/01-app/03-api-reference/02-components/image.mdx\n\nSpecify the default allowed image quality values in `next.config.js`. This field is required starting with Next.js 16.\n\n```js\nmodule.exports = {\n  images: {\n    qualities: [75],\n  },\n}\n```\n\n--------------------------------\n\n### Semantic diagnostics gated on isAppEntry — non-entry files get no Next.js checks\n\nSource: https://github.com/vercel/next.js/blob/canary/packages/next/src/server/typescript/index.ts\n\nAll framework-specific diagnostic rules (entryConfig, metadata, clientBoundary, serverBoundary) are gated behind `isAppEntry` (line 185) or `isClientEntry`/`isServerEntry` (which also require being an app entry file). Non-page/layout modules bypass all of these checks entirely, confirming that normal TypeScript module changes need no Next-specific API changes.\n\n```typescript\nproxy.getSemanticDiagnostics = (fileName: string) =\u003e {\n  const prior = info.languageService.getSemanticDiagnostics(fileName)\n  const source = getSource(fileName)\n  if (!source) return prior\n\n  let isClientEntry = false\n  let isServerEntry = false\n  const isAppEntry = isAppEntryFile(fileName)\n\n  try {\n    const entryInfo = getEntryInfo(fileName, true)\n    isClientEntry = entryInfo.client\n    isServerEntry = entryInfo.server\n  } catch (e: any) {\n    prior.push({\n      file: source,\n      category: ts.DiagnosticCategory.Error,\n      code: NEXT_TS_ERRORS.MISPLACED_ENTRY_DIRECTIVE,\n      ...e,\n    })\n    isClientEntry = false\n    isServerEntry = false\n  }\n\n  if (isInsideApp(fileName)) {\n    const errorDiagnostic = errorEntry.getSemanticDiagnostics(\n      source!,\n      isClientEntry\n    )\n    prior.push(...errorDiagnostic)\n  }\n\n  ts.forEachChild(source!, (node) =\u003e {\n    if (ts.isImportDeclaration(node)) {\n      // import ...\n      if (isAppEntry) {\n        if (!isClientEntry || isServerEntry) {\n          // Check if it has valid imports in the server layer\n          const diagnostics =\n            serverLayer.getSemanticDiagnosticsForImportDeclaration(\n              source,\n              node\n            )\n          prior.push(...diagnostics)\n        }\n      }\n    } else if (\n      ts.isVariableStatement(node) \u0026\u0026\n      node.modifiers?.some((m) =\u003e m.kind === ts.SyntaxKind.ExportKeyword)\n    ) {\n      // export const ...\n      if (isAppEntry) {\n        // Check if it has correct option exports\n        const diagnostics =\n          entryConfig.getSemanticDiagnosticsForExportVariableStatement(\n            source,\n            node\n          )\n        const metadataDiagnostics = isClientEntry\n          ? metadata.client.getSemanticDiagnosticsForExportVariableStatement(\n              fileName,\n              node\n            )\n          : metadata.server.getSemanticDiagnosticsForExportVariableStatement(\n              fileName,\n              node\n            )\n        prior.push(...diagnostics, ...metadataDiagnostics)\n      }\n\n      if (isClientEntry) {\n        prior.push(\n          ...clientBoundary.getSemanticDiagnosticsForExportVariableStatement(\n            source,\n            node\n          )\n        )\n      }\n\n      if (isServerEntry) {\n        prior.push(\n          ...serverBoundary.getSemanticDiagnosticsForExportVariableStatement(\n            source,\n            node\n          )\n        )\n      }\n    } else if (isDefaultFunctionExport(node)) {\n      // export default function ...\n      if (isAppEntry) {\n        const diagnostics = entryDefault.getSemanticDiagnostics(\n          fileName,\n          ...\n```&quot;,

              &quot;content&quot;: &quot;### getFrameworkVersion: Detects Next.js version for init command\n\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/utils/get-project-info.ts\n\nExtracts the Next.js version from package.json dependencies, enabling the CLI to detect Next.js 16+ and trigger the middleware-to-proxy rename.\n\n```typescript\nexport async function getFrameworkVersion(\n  framework: Framework,\n  packageJson: ReturnType\u003ctypeof getPackageInfo\u003e\n) {\n  if (!packageJson) {\n    return null\n  }\n\n  // Only detect Next.js version for now.\n  if (![\&quot;next-app\&quot;, \&quot;next-pages\&quot;].includes(framework.name)) {\n    return null\n  }\n\n  const version =\n    packageJson.dependencies?.next || packageJson.devDependencies?.next\n\n  if (!version) {\n    return null\n  }\n\n  // Extract full semver (major.minor.patch), handling ^, ~, etc.\n  const versionMatch = version.match(/^[\\^~]?(\\d+\\.\\d+\\.\\d+)/)\n  if (versionMatch) {\n    return versionMatch[1] // e.g., \&quot;16.0.0\&quot;\n  }\n\n  // For ranges like \&quot;\u003e=15.0.0 \u003c16.0.0\&quot;, extract the first version.\n  const rangeMatch = version.match(/(\\d+\\.\\d+\\.\\d+)/)\n  if (rangeMatch) {\n    return rangeMatch[1]\n  }\n\n  // For \&quot;latest\&quot;, \&quot;canary\&quot;, \&quot;rc\&quot;, etc., return the tag as-is.\n  return version\n}\n```\n\n--------------------------------\n\n### transformNext: Renames middleware to proxy in source code\n\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/utils/transformers/transform-next.ts\n\nAST transformer that renames `middleware` to `proxy` in function declarations, variable declarations, and export aliases for Next.js 16+ compatibility.\n\n```typescript\nimport { Transformer } from \&quot;@/src/utils/transformers\&quot;\n\nexport const transformNext: Transformer = async ({ sourceFile }) =\u003e {\n  // export function middleware.\n  sourceFile.getFunctions().forEach((func) =\u003e {\n    if (func.getName() === \&quot;middleware\&quot;) {\n      func.rename(\&quot;proxy\&quot;)\n    }\n  })\n\n  // export const middleware.\n  sourceFile.getVariableDeclarations().forEach((variable) =\u003e {\n    if (variable.getName() === \&quot;middleware\&quot;) {\n      variable.rename(\&quot;proxy\&quot;)\n    }\n  })\n\n  // export { handler as middleware }.\n  sourceFile.getExportDeclarations().forEach((exportDecl) =\u003e {\n    const namedExports = exportDecl.getNamedExports()\n    namedExports.forEach((namedExport) =\u003e {\n      if (namedExport.getName() === \&quot;middleware\&quot;) {\n        namedExport.setName(\&quot;proxy\&quot;)\n      }\n      const aliasNode = namedExport.getAliasNode()\n      if (aliasNode?.getText() === \&quot;middleware\&quot;) {\n        namedExport.setAlias(\&quot;proxy\&quot;)\n      }\n    })\n  })\n\n  return sourceFile\n}\n```\n\n--------------------------------\n\n### _isNext16Middleware and file rename: Guards middleware-to-proxy rename\n\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/utils/updaters/update-files.ts\n\nDetects root-level middleware.ts/js in Next.js 16+ projects, then renames the file from middleware.ts to proxy.ts and injects the transformNext AST transformer.\n\n```typescript\nfunction _isNext16Middleware(\n  filePath: string,\n  projectInfo: ProjectInfo | null,\n  config: Config\n) {\n  const isRootMiddleware =\n    filePath === path.join(config.resolvedPaths.cwd, \&quot;middleware.ts\&quot;) ||\n    filePath === path.join(config.resolvedPaths.cwd, \&quot;middleware.js\&quot;)\n\n  const isNextJs =\n    projectInfo?.framework.name === \&quot;next-app\&quot; ||\n    projectInfo?.framework.name === \&quot;next-pages\&quot;\n\n  if (!isRootMiddleware || !isNextJs || !projectInfo?.frameworkVersion) {\n    return false\n  }\n\n  const majorVersion = parseInt(projectInfo.frameworkVersion.split(\&quot;.\&quot;)[0])\n  const isNext16Plus = !isNaN(majorVersion) \u0026\u0026 majorVersion \u003e= 16\n\n  return isNext16Plus\n}\n```\n\n--------------------------------\n\n### Switch component composition (new-york-v4 style)\n\nSource: https://github.com/shadcn-ui/ui/blob/main/apps/v4/registry/new-york-v4/ui/switch.tsx\n\nThe official shadcn/ui Switch built on Radix UI SwitchPrimitive.Root and SwitchPrimitive.Thumb, with size variants (`sm` and `default`) and data-slot attributes.\n\n```typescript\n\&quot;use client\&quot;\n\nimport * as React from \&quot;react\&quot;\nimport { Switch as SwitchPrimitive } from \&quot;radix-ui\&quot;\n\nimport { cn } from \&quot;@/lib/utils\&quot;\n\nfunction Switch({\n  className,\n  size = \&quot;default\&quot;,\n  ...props\n}: React.ComponentProps\u003ctypeof SwitchPrimitive.Root\u003e \u0026 {\n  size?: \&quot;sm\&quot; | \&quot;default\&quot;\n}) {\n  return (\n    \u003cSwitchPrimitive.Root\n      data-slot=\&quot;switch\&quot;\n      data-size={size}\n      className={cn(\n        \&quot;peer group/switch inline-flex shrink-0 items-center rounded-full border border-transparent shadow-xs transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 data-[size=default]:h-[1.15rem] data-[size=default]:w-8 data-[size=sm]:h-3.5 data-[size=sm]:w-6 data-[state=checked]:bg-primary data-[state=unchecked]:bg-input dark:data-[state=unchecked]:bg-input/80\&quot;,\n        className\n      )}\n      {...props}\n    \u003e\n      \u003cSwitchPrimitive.Thumb\n        data-slot=\&quot;switch-thumb\&quot;\n        className={cn(\n          \&quot;pointer-events-none block rounded-full bg-background ring-0 transition-transform group-data-[size=default]/switch:size-4 group-data-[size=sm]/switch:size-3 data-[state=checked]:translate-x-[calc(100%-2px)] data-[state=unchecked]:translate-x-0 dark:data-[state=checked]:bg-primary-foreground dark:data-[state=unchecked]:bg-foreground\&quot;\n        )}\n      /\u003e\n    \u003c/SwitchPrimitive.Root\u003e\n  )\n}\n\nexport { Switch }\n```\n\n--------------------------------\n\n### preFlightAdd: components.json existence check\n\nSource: https://github.com/shadcn-ui/ui/blob/main/packages/shadcn/src/preflights/preflight-add.ts\n\nIf components.json exists and is valid, init is not required — the config is returned and used directly. If missing, a MISSING_CONFIG error is set. If invalid, it exits with a message telling the user to run init.\n\n```typescript\n  // Check for existing components.json file.\n  if (!fs.existsSync(path.resolve(options.cwd, \&quot;components.json\&quot;))) {\n    // Check if we&#x27;re in a monorepo root.\n    if (await isMonorepoRoot(options.cwd)) {\n      const targets = await getMonorepoTargets(options.cwd)\n      if (targets.length \u003e 0) {\n        formatMonorepoMessage(\&quot;add [component]\&quot;, targets)\n        process.exit(1)\n      }\n    }\n\n    errors[ERRORS.MISSING_CONFIG] = true\n    return {\n      errors,\n      config: null,\n    }\n  }\n\n  try {\n    const config = await getConfig(options.cwd)\n\n    return {\n      errors,\n      config: config!,\n    }\n  } catch (error) {\n    logger.break()\n    logger.error(\n      `An invalid ${highlighter.info(\n        \&quot;components.json\&quot;\n      )} file was found at ${highlighter.info(\n        options.cwd\n      )}.\\nBefore you can add components, you must create a valid ${highlighter.info(\n        \&quot;components.json\&quot;\n      )} file by running the ${highlighter.info(\&quot;init\&quot;)} command.`\n    )\n    logger.error(\n      `Learn more at ${highlighter.info(`${SHADCN_URL}/docs/components-json`)}.`\n    )\n    logger.break()\n    process.exit(1)\n  }\n```&quot;,

              &quot;content&quot;: &quot;### Cloudflare Turnstile Validation Edge Function (TypeScript)\n\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/functions/examples/cloudflare-turnstile.mdx\n\nImplements server-side validation for Cloudflare Turnstile tokens using a Supabase Edge Function. It verifies the token against Cloudflare&#x27;s &#x27;/siteverify&#x27; endpoint and requires a &#x27;CLOUDFLARE_SECRET_KEY&#x27; environment variable.\n\n```ts\nimport { withSupabase } from &#x27;npm:@supabase/server@^1&#x27;\n\nconsole.log(&#x27;Hello from Cloudflare Trunstile!&#x27;)\n\nfunction ips(req: Request) {\n  return req.headers.get(&#x27;x-forwarded-for&#x27;)?.split(/\\s*,\\s*/)\n}\n\n// `withSupabase` handles CORS and preflight requests for you.\nexport default {\n  fetch: withSupabase({ auth: &#x27;none&#x27; }, async (req) =\u003e {\n    const { token } = await req.json()\n    const clientIps = ips(req) || [&#x27;&#x27;]\n    const ip = clientIps[0]\n\n    // Validate the token by calling the\n    // \&quot;/siteverify\&quot; API endpoint.\n    let formData = new FormData()\n    formData.append(&#x27;secret&#x27;, Deno.env.get(&#x27;CLOUDFLARE_SECRET_KEY&#x27;) ?? &#x27;&#x27;)\n    formData.append(&#x27;response&#x27;, token)\n    formData.append(&#x27;remoteip&#x27;, ip)\n\n    const url = &#x27;https://challenges.cloudflare.com/turnstile/v0/siteverify&#x27;\n    const result = await fetch(url, {\n      body: formData,\n      method: &#x27;POST&#x27;,\n    })\n\n    const outcome = await result.json()\n    console.log(outcome)\n    if (outcome.success) {\n      return Response.json({ success: true })\n    }\n    return Response.json({ success: false })\n  }),\n}\n```\n\n--------------------------------\n\n### Initialize the Supabase client\n\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/getting-started/quickstarts/kotlin.mdx\n\nCreate a Supabase client instance using your project URL and publishable API key.\n\n```kotlin\nimport ...\n\nval supabase = createSupabaseClient(\n    supabaseUrl = \&quot;https://xyzcompany.supabase.co\&quot;,\n    supabaseKey = \&quot;your_publishable_key\&quot;\n  ) {\n    install(Postgrest)\n}\n...\n```\n\n--------------------------------\n\n### Correct Browser Client Implementation\n\nSource: https://github.com/supabase/supabase/blob/master/examples/prompts/nextjs-supabase-auth.md\n\nExample of how to correctly implement the Supabase browser client using `@supabase/ssr`.\n\n```typescript\nimport { createBrowserClient } from &#x27;@supabase/ssr&#x27;\n\nexport function createClient() {\n  return createBrowserClient(\n    process.env.NEXT_PUBLIC_SUPABASE_URL!,\n    process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY!\n  )\n}\n```\n\n--------------------------------\n\n### PUT /v1/projects/{PROJECT_REF}/ssl-enforcement\n\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/platform/ssl-enforcement.mdx\n\nUpdates the SSL enforcement status for a Supabase project&#x27;s database, either enabling or disabling it. This action triggers a fast database reboot.\n\n```APIDOC\n## PUT /v1/projects/{PROJECT_REF}/ssl-enforcement\n\n### Description\nUpdates the SSL enforcement status for a Supabase project&#x27;s database. Setting `database` to `true` enables SSL enforcement, while `false` disables it. This operation will cause a brief database reboot.\n\n### Method\nPUT\n\n### Endpoint\nhttps://api.supabase.com/v1/projects/{PROJECT_REF}/ssl-enforcement\n\n### Parameters\n#### Path Parameters\n- **PROJECT_REF** (string) - Required - The unique reference ID of your Supabase project.\n\n#### Request Body\n- **requestedConfig** (object) - Required - An object containing the desired configuration settings.\n  - **database** (boolean) - Required - Set to `true` to enable SSL enforcement, or `false` to disable it.\n\n### Request Example\n```json\n{\n  \&quot;requestedConfig\&quot;: {\n    \&quot;database\&quot;: true\n  }\n}\n```\n\n### Response\n#### Success Response (200)\n- **status** (string) - A message indicating the success of the update operation.\n\n#### Response Example\n```json\n{\n  \&quot;status\&quot;: \&quot;SSL enforcement updated successfully\&quot;\n}\n```\n```\n\n--------------------------------\n\n### Configure Supabase Environment Variables\n\nSource: https://github.com/supabase/supabase/blob/master/apps/docs/content/guides/getting-started/tutorials/with-nextjs.mdx\n\nSave your Supabase API URL and publishable key in a `.env.local` file at the project root for application access.\n\n```bash\nNEXT_PUBLIC_SUPABASE_URL=YOUR_SUPABASE_URL\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=YOUR_SUPABASE_PUBLISHABLE_KEY\n```&quot;,
